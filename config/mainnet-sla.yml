clusters:
  mainnet-sla:
    _inherit: ""
    name: bee
    namespace: bee-sla
    disable-namespace: true
    api-domain: internal.ethswarm.org
    api-domain-internal: 'bee-sla.svc.godfather2.local:1633'
    api-insecure-tls: true
    api-scheme: https
    funding:
      eth: 0.1
      gbzz: 2.0
    node-groups:
      bee-sla-1:
        mode: node
        bee-config: mainnet-sla
        config: mainnet-sla
        count: 1
      bee-sla-2:
        mode: node
        bee-config: mainnet-sla
        config: mainnet-sla
        count: 1
      bee-sla-3:
        mode: node
        bee-config: mainnet-sla
        config: mainnet-sla
        count: 1
      bee-sla-4:
        mode: node
        bee-config: mainnet-sla
        config: mainnet-sla
        count: 1

# node-groups defines node groups that can be registered in the cluster
# node-groups may inherit it's configuration from already defined node-group and override specific fields from it
node-groups:
  mainnet-sla:
    _inherit: "default"
    persistence-enabled: true

# bee-configs defines Bee configuration that can be assigned to node-groups
# bee-configs may inherit it's configuration from already defined bee-config and override specific fields from it
bee-configs:
  mainnet-sla:
    _inherit: "default"
    bootnode: ["/dnsaddr/mainnet.ethswarm.org"]

# checks defines checks Beekeeper can execute against the cluster
# type filed allows defining same check with different names and options
checks:
  sla-feed:
    options:
      # 24h was rejected by bee: "insufficient amount for 24h minimum validity".
      # beekeeper derives the batch amount as (ttl_seconds / blockTime) * price
      # with integer division, so asking for exactly the 24h minimum lands on or
      # just below bee's threshold. 48h clears it and matches sla-smoke.
      postage-ttl: 48h
      postage-depth: 17 # minimum usable depth (bucket depth is 16)
      postage-label: sla-feed # distinct label so the batch is reused until full
    timeout: 1h
    type: feed
  sla-smoke:
    options:
      # 1h under the 12h cron period so the run always finishes before the next
      # trigger; with concurrencyPolicy Forbid an overrun skips a whole cycle.
      # Same convention as mainnet-dev-bee-cheq.
      duration: 11h
      content-size: 50000000
      postage-ttl: 48h # 24000/5*60*60*24*7
      postage-depth: 20
      upload-groups:
        - bee-sla-1
        - bee-sla-3
      download-groups:
        - bee-sla-2
        - bee-sla-4
    timeout: 720h
    type: smoke
  sla-availability:
    options:
      # Reference files this check downloads every next-iter-wait to prove the
      # network still serves previously-stored content.
      #
      # 2026-08-16: the first two refs were replaced. The originals
      #   2e70bb26d5b1f6f4a0961c42bb62e1066334a456c8835fb7ba34077b9d36859b
      #   d5fc0a2753360ddfb1825fb2d979031d4b620ddabd3e0aea69b685109ee357fe
      # had been failing EVERY iteration with "hashing copy: unexpected EOF" -
      # the root chunk still resolved but the payload chunks were gone. It was
      # not a node fault: each iteration failed on a different bee-sla node.
      # The error counter shows this had been true since at least 2026-05-17,
      # unnoticed because the Long availability dashboard did not render and
      # nothing alerts on beekeeper_check_longavailability_d_download_status.
      #
      # ROOT CAUSE: the content was stamped with batches whose TTL is measured
      # in days (the batches on bee-sla-2-0 ranged 0.2 - 6.7 days on 2026-08-16).
      # A long-availability test on week-long postage will always rot. Replacing
      # refs without fixing postage just restarts the clock - see
      # deployments/mainnet/topup-sla-availability.yaml, which keeps the batch
      # below alive. Do not add refs stamped on a short-lived batch.
      #
      # Batch: 5e7cad242a1727f077fbef534efdd73b3577b876fcb1131284eb5d7b9537e4df
      #        depth 20, immutable, label sla-availability, created 2026-08-16.
      #        Bought at depth 17 and diluted to 20: bucketDepth is 16, so depth
      #        17 gives only 2 chunk slots per bucket and overissues at ~3k
      #        chunks. Depth 20 (16 slots) is the practical minimum here.
      #
      # Both replacements are 158,637,636 bytes, matching the surviving ref so
      # throughput stays comparable. Content is reproducible without storing it:
      #   openssl enc -aes-256-ctr -pass pass:"<seed>" -nosalt -in /dev/zero \
      #     | head -c 158637636
      #   a61d5acf... seed "sla-availability-ref-a-2026-08-16"
      #               sha256 9a8e073f2ce01a01b597321c0c4f909688f5bdf207203b27876118b77c19a1db
      #   e65a8074... seed "sla-availability-ref-b-2026-08-16"
      #               sha256 533e4ff956ea5e77bbe37ca283453bdd5b049449f3c85bc33bb23433869794b9
      # Both verified downloading in full, with matching checksums, from
      # bee-sla-4-0 and bee-sla-2-0 (uploader was bee-sla-1-0) before this commit.
      refs:
        - "a61d5acf669446701861f63a5b668920a73967cf88608a466f12068c684b25f7"
        - "e65a807476fe2756cc212eba4c26c7e3e95aa7cea99e4527cce7086eb138accd"
        # Original third ref - still healthy, kept for continuity of history.
        - "1cfd24178c67b708694b4ce4235d32e2a39d42813d2b09d1ef77eaa4c954931f"
      retry-wait: 1m
      retry-count: 3
      next-iter-wait: 12h
    timeout: 720h
    type: longavailability
  sla-durability:
    options:
      ref: 16c1437d310202ccea278cf1ea98cbd7f2830929d9e41b2a8fc9a1df74fa0d3f
      concurrency: 20
      max-attempts: 100
    timeout: 720h
    type: datadurability
  sla-networkavailability:
    options:
      postage-ttl: 168h # 24000/5*60*60*24*7
      postage-depth: 20
      sleep-duration: 1h
    timeout: 720h
    type: networkavailability
