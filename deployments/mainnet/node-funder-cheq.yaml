image:
  pullPolicy: IfNotPresent
  tag: "{{ beekeeper_tag }}"

serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## create role or/and cluster role for the service account
  createRole: true
  createClusterRole: true

## The funding wallet key is injected from a Secret rather than passed on the
## command line: anything in config.command is stored verbatim in the CronJob
## spec and is readable by anyone who can read that object in the namespace.
## Beekeeper reads --wallet-key from BEEKEEPER_WALLET_KEY (viper, prefix
## "beekeeper", dashes replaced by underscores). Requires chart >= 0.4.14.
extraEnv:
  - name: BEEKEEPER_WALLET_KEY
    valueFrom:
      secretKeyRef:
        name: beekeeper-wallet-key
        key: walletKey

config:
  command: ['beekeeper', 'node-funder', '--namespace=dev-bee-perf', '--min-swarm=50', '--min-native=1', '--label-selector=role=perf-cheq-bee']
  # environment variables
  CONFIG_GIT_REPO: 'https://github.com/ethersphere/beekeeper-config.git'
  CONFIG_GIT_BRANCH: master
  GETH_URL: http://rpc-gnosis-haproxy.default.svc.{{ cluster_id }}.local
  # cron job - every 12 hours, at 00:00 and 12:00
  #
  # WAS: '* */12 */7 * *' - same defect as node-funder-sla. Day-of-month */7
  # restricts it to days 1, 8, 15, 22, 29 only, and minute '*' made it fire
  # every minute for two hours on those days. The dev-bee-perf cheq nodes could
  # therefore go up to 7 days without a top-up. See node-funder-sla.yaml for the
  # 30-day outage this exact pattern caused on bee-sla.
  schedule: '0 */12 * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

