image:
  pullPolicy: IfNotPresent
  tag: "{{ beekeeper_tag }}"

serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## create role or/and cluster role for the service account
  createRole: true
  createClusterRole: true

config:
  command: ['beekeeper', 'check', '--cluster-name=mainnet-sla', '--checks=sla-smoke', '--metrics-labels=check=sla-smoke', '--create-cluster=false', '--metrics-pusher-address=pushgateway-prometheus-pushgateway.monitoring.svc.{{ cluster_id }}.local:9091', '--timeout=720h', '--in-cluster=true']
  dirPath: 'files'
  # environment variables
  CONFIG_GIT_REPO: 'https://github.com/ethersphere/beekeeper-config.git'
  CONFIG_GIT_BRANCH: master
  CONFIG_GIT_DIR: 'config'
  GETH_URL: http://rpc-gnosis-haproxy.default.svc.{{ cluster_id }}.local
  # cron job - every 12h, matching the check's 11h duration.
  # WAS '10 */2 * * *'. The smoke check is a continuous sampler, not a
  # one-shot: it loops every iteration-wait for `duration` (12h by default).
  # With concurrencyPolicy Forbid a 12h run silently skipped the 22:10,
  # 00:10, 02:10, 04:10 and 06:10 triggers, so a schedule advertising a 2h
  # cadence actually delivered two runs a day.
  schedule: '10 */12 * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
