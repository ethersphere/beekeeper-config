image:
  pullPolicy: IfNotPresent
  tag: "{{ beekeeper_tag }}"

serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## create role or/and cluster role for the service account
  createRole: true
  createClusterRole: true

## The funding wallet key is injected from a Secret rather than passed on the
## command line: anything in config.command is stored verbatim in the CronJob
## spec and is readable by anyone who can read that object in the namespace.
## Beekeeper reads --wallet-key from BEEKEEPER_WALLET_KEY (viper, prefix
## "beekeeper", dashes replaced by underscores). Requires chart >= 0.4.14.
extraEnv:
  - name: BEEKEEPER_WALLET_KEY
    valueFrom:
      secretKeyRef:
        name: beekeeper-wallet-key
        key: walletKey

config:
  command: ['beekeeper', 'node-funder', '--addresses=0x369e38fb83148fb269f74863006e0e6210fe0c3e,0x31ac10a776a10242b2027da315d5f456d70fb98f,0xe2d71aad5e0066be7f4e3f914ceaa4327d8a39e8,0x8680d5562e5381d2b5011dd1b86ecf61a81ec8dc,0x5cb4839b7d7b0ab6baabfedd6749497eca65b2ca', '--min-swarm=50', '--min-native=1']
  # environment variables
  CONFIG_GIT_REPO: 'https://github.com/ethersphere/beekeeper-config.git'
  CONFIG_GIT_BRANCH: master
  GETH_URL: http://rpc-gnosis-haproxy.default.svc.{{ cluster_id }}.local
  # cron job - hourly at :10
  #
  # WAS: '10 * */7 * *'. Minute and hour were already correct (hourly at :10);
  # the day-of-month */7 was the defect, restricting it to days 1, 8, 15, 22, 29
  # so these nodes could go 7 days without a top-up. Only that field is removed,
  # so the original hourly intent is preserved. See node-funder-sla.yaml for the
  # 30-day outage the same day-of-month pattern caused on bee-sla.
  schedule: '10 * * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
