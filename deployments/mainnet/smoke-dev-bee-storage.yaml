image:
  pullPolicy: IfNotPresent
  tag: "{{ beekeeper_tag }}"

serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## create role or/and cluster role for the service account
  createRole: true
  createClusterRole: true

# Smoke check against the dev-bee-storage namespace (bee-1..bee-4), cluster
# mainnet-storage in config/mainnet-storage.yaml.
config:
  command: ['beekeeper', 'check', '--cluster-name=mainnet-storage', '--checks=mainnet-storage-smoke', '--metrics-labels=check=mainnet-storage-smoke', '--create-cluster=false', '--metrics-pusher-address=pushgateway-prometheus-pushgateway.monitoring.svc.{{ cluster_id }}.local:9091', '--timeout=720h', '--in-cluster=true']
  dirPath: 'files'
  # environment variables
  CONFIG_GIT_REPO: 'https://github.com/ethersphere/beekeeper-config.git'
  CONFIG_GIT_BRANCH: master
  CONFIG_GIT_DIR: 'config'
  GETH_URL: http://rpc-gnosis-haproxy.default.svc.{{ cluster_id }}.local
  # cron job - every 12h, matching the check's 11h duration (see sla-smoke in
  # smoke-sla.yaml: the smoke check loops for `duration`, so a shorter cadence
  # would just be skipped under concurrencyPolicy Forbid).
  schedule: '10 */12 * * *'
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
