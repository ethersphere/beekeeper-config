image:
  repository: ethersphere/beekeeper
  # Deliberately {{ beekeeper_tag }} (resolves to the newest upstream tag at deploy
  # time, v0.36.0 as of 2026-08-16), matching every mainnet deployment.
  #
  # 0.36 is REQUIRED, not cosmetic: beekeeper only started pushing its own
  # `cluster` and `namespace` labels in 0.36.0. On 0.35.x the --cluster-name flag
  # has no effect on metrics at all - Prometheus's external label shows through
  # instead, which is why these testnet checks reported cluster=swarm1 and why the
  # testnet-public / testnet-light rename was invisible for them.
  tag: "{{ beekeeper_tag }}"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: "beekeeper-load"
fullnameOverride: "beekeeper-load"

serviceAccount:
  ## Specifies whether a service account should be created
  create: true
  ## Name of the service account to use
  ## if not set and create is true, a name is generated using the fullname template
  name:
  ## create role or/and cluster role for the service account
  createRole: true
  createClusterRole: true

## Define resource requests and limits to allocate CPU and memory effectively.
## Example:
# resources:
#   limits:
#     cpu: "1"        # Maximum CPU usage (e.g., 1 core)
#     memory: "1Gi"   # Maximum memory usage (e.g., 1 GiB)
#   requests:
#     cpu: "100m"     # Minimum guaranteed CPU usage (e.g., 100 millicores)
#     memory: "128Mi" # Minimum guaranteed memory usage (e.g., 128 MiB)
resources: {}

nodeSelector: {}

# RECONCILED TO LIVE 2026-08-16. This file had drifted badly from the CronJob
# actually running as beekeeper-load-cronjob in swarm1/beekeeper, and applying
# it as written would have broken the check:
#
#   field              was committed                   live (now captured here)
#   --checks           testnet-smoke  <-- UNDEFINED     pt-testnet-load
#   --config-git-repo  ethersphere/beekeeper-config     ethersphere/beekeeper
#   schedule           * * * * *                        */15 * * * *
#   --create-cluster   (absent)                         false
#   image tag          latest / Always                  0.35.0
#   --geth-url         passed as a command flag         set via GETH_URL env
#   --log-verbosity    debug                            (absent)
#   --metrics-enabled  true                             (absent)
#
# `testnet-smoke` is not a defined check at all - config/bee-testnet.yaml
# defines pt-smoke, pt-testnet-load, pt-pingpong, pt-retrieval, pt-manifest,
# pt-pss, pt-soc, pt-pushsync-chunks, pt-postage, pt-gsoc, pt-feed,
# pt-feed-availability, pt-redundancy and pt-settlements, and nothing named
# testnet-smoke. Whoever last fixed this fixed it on the cluster and never
# brought it back here.
#
# Live was treated as the source of truth for the mechanical fields above, with
# one deliberate exception:
#
#   --config-git-repo now points at THIS repo, not ethersphere/beekeeper.
#
# The live job read cluster and check definitions from the upstream *code*
# repo, whose config/ directory holds upstream's own examples (local.yaml,
# localhost.yaml, staging.yaml...). Production checks should not take their
# definitions from a directory upstream can change without warning. The two
# other testnet jobs (beekeeper-check-public.yaml,
# beekeeper-node-funder-cronjob.yaml) were already committed pointing here.
#
# Diffed before switching (2026-08-16), upstream public-testnet.yaml vs this
# repo's bee-testnet.yaml: same cluster, same 14 pt-* checks, same node-group,
# and byte-identical bee-config contents (only the key name differs, sepolia vs
# sepolia-testnet). The single behavioural change for this job is postage-ttl
# on pt-testnet-load: 408h upstream -> a uniform 336h here. Chosen deliberately.
# The larger pt-smoke divergence does not apply - this job does not run it.
#
# backoffLimit was 1 here and unset on the live Job (so the Kubernetes default
# of 6 applies). Left at 1 rather than guessing - flag if the difference
# matters.
#
# NOTE: THIS DIRECTORY IS NOT DEPLOYED BY ANYTHING.
#
# beekeeper.yml in the ansible repo clones this repo and then selects files by
# path: `/mainnet/` goes to the mainnetdeploy host (godfather2), `/testnet/` to
# testnetdeploy (swarm1). Everything under deployments/check, /load,
# /node-funder, /smoke and /stamper matches neither filter and is therefore
# never applied - which is exactly why this file drifted so far from the
# running CronJob, and why its undefined --checks=testnet-smoke never broke
# anything. Confirmed 2026-08-16: a push DOES auto-deploy mainnet files (the
# new topup-sla-availability release appeared within four minutes of a push),
# but files here are skipped.
#
# So editing this file changes nothing on its own. The live CronJob was
# repointed at beekeeper-config by direct kubectl patch on 2026-08-16. To make
# this directory meaningful, the manifests need moving under deployments/testnet
# (release name = file basename, so renames create new releases rather than
# adopting the existing ones - check `kubectl get secret -n beekeeper -l
# owner=helm` for the current release names first).
config:
  command:
    [
      "beekeeper",
      "check",
      "--cluster-name=testnet-public",
      "--checks=pt-testnet-load",
      "--create-cluster=false",
      "--metrics-pusher-address=pushgateway-prometheus-pushgateway.monitoring.svc.swarm1.local:9091",
      "--timeout=13h",
      "--in-cluster=true",
      "--config-git-repo=https://github.com/ethersphere/beekeeper-config.git",
      "--config-git-dir=config",
      "--config-git-branch=master",
    ]
  # environment variables
  GETH_URL: "http://rpc-sepolia-haproxy.default.svc.swarm1.local"
  BZZ_TOKEN_ADDRESS: "0x6aab14fe9cccd64a502d23842d916eb5321c26e7"
  ETH_ACCOUNT: "0x62cab2b3b55f341f10348720ca18063cdb779ad5"
  # if singleRun is enabled cron job settings will be omitted
  # job
  singleRun: false
  backoffLimit: 1
  # cron job
  schedule: "*/15 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  # if it is enabled it will create init container that will wait
  # for cluster to be up and operational
  initPing:
    enabled: false
    clusterName: ""
